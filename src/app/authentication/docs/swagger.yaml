definitions:
  models.BFFChangePasswordRequest:
    properties:
      confirmPassword:
        example: Xyz@12345
        type: string
      password:
        example: Xyz@12345
        maxLength: 20
        minLength: 8
        type: string
    required:
    - confirmPassword
    - password
    type: object
  models.BFFChangePasswordResponse:
    properties:
      message:
        example: Password changed successfully
        type: string
    type: object
  models.BFFCreateUserRequest:
    properties:
      confirmPassword:
        example: Secure@123
        minLength: 8
        type: string
      email:
        example: arijit@gmail.com
        type: string
      panCard:
        example: EQZRP1234P
        type: string
      password:
        example: Secure@123
        maxLength: 20
        minLength: 8
        type: string
      phoneNumber:
        example: 7568912340
        maximum: 9999999999
        minimum: 1000000000
        type: integer
      username:
        example: Arijit
        maxLength: 32
        minLength: 5
        type: string
    required:
    - confirmPassword
    - email
    - panCard
    - password
    - phoneNumber
    - username
    type: object
  models.BFFLogoutResponse:
    properties:
      status:
        example: Success or failure
        type: string
    type: object
  models.BFFSignInUserRequest:
    properties:
      password:
        example: Dk@12345678
        maxLength: 20
        minLength: 8
        type: string
      username:
        example: Dharmesh
        maxLength: 32
        minLength: 5
        type: string
    required:
    - password
    - username
    type: object
  models.BFFValidateUserOtpRequest:
    properties:
      otp:
        example: "1234"
        type: string
      username:
        example: Dharmesh
        maxLength: 32
        minLength: 5
        type: string
    required:
    - otp
    - username
    type: object
  models.BFFValidateUserOtpResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  models.ErrorAPIResponse:
    properties:
      error:
        type: string
      errors:
        $ref: '#/definitions/models.ErrorMessage'
    type: object
  models.ErrorMessage:
    properties:
      errorMessage:
        type: string
      key:
        type: string
    type: object
info:
  contact: {}
  description: backend for Auth micro-service (Middleware layer).
  title: backend
  version: "1.0"
paths:
  /api/auth/change-password:
    patch:
      consumes:
      - application/json
      description: Handles the user's change password request and stores the new password
        in database
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/models.BFFChangePasswordResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - User
  /api/auth/logout:
    post:
      description: handles logout request of the user
      produces:
      - application/json
      responses:
        "200":
          description: User logout successfully
          schema:
            $ref: '#/definitions/models.BFFLogoutResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      security:
      - BearerAuth: []
      summary: logout user feature
      tags:
      - User
  /api/auth/signin:
    post:
      consumes:
      - application/json
      description: Handles the user sign and checks data from database
      parameters:
      - description: User Sign In Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFSignInUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User Sign In successfully
          schema:
            type: string
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "404":
          description: User record not found
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Sign In User
      tags:
      - User
  /api/auth/signup:
    post:
      consumes:
      - application/json
      description: Handles user registration by validating input and storing user
        details
      parameters:
      - description: User Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFCreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            type: string
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Create a new user
      tags:
      - User
  /api/auth/validate-otp:
    post:
      consumes:
      - application/json
      description: Validates user OTP and return clear success/ failure message
      parameters:
      - description: User OTP Validation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFValidateUserOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP validation successful
          schema:
            $ref: '#/definitions/models.BFFValidateUserOtpResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "401":
          description: 'Case A: Incorrect OTP / Case B: Expired OTP'
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Validates user OTP
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
    x-extension-openapi: '{"example": "value on a json format"}'
swagger: "2.0"
