definitions:
  models.BFFChangePasswordRequest:
    properties:
      confirmpassword:
        example: Sakshi@123
        type: string
      newpassword:
        example: Sakshi@123
        maxLength: 20
        minLength: 8
        type: string
    required:
    - newpassword
    type: object
  models.BFFChangePasswordResponse:
    properties:
      message:
        example: password updated successfully
        type: string
    type: object
  models.BFFCreateUserRequest:
    properties:
      confirmPassword:
        example: Sakshi@123
        minLength: 8
        type: string
      email:
        example: sakshi@gmail.com
        type: string
      panCard:
        example: ABCDE1234S
        type: string
      password:
        example: Sakshi@123
        maxLength: 20
        minLength: 8
        type: string
      phoneNumber:
        example: 9876543210
        maximum: 9999999999
        minimum: 1000000000
        type: integer
      username:
        example: Sakshi
        maxLength: 32
        minLength: 5
        type: string
    required:
    - confirmPassword
    - email
    - panCard
    - password
    - phoneNumber
    - username
    type: object
  models.BFFSigninUserRequest:
    properties:
      password:
        example: Sakshi@123
        maxLength: 20
        minLength: 8
        type: string
      username:
        example: Sakshi
        maxLength: 32
        minLength: 5
        type: string
    required:
    - password
    - username
    type: object
  models.BFFSigninUserResponse:
    properties:
      message:
        example: user logged in successfully
        type: string
      otpexpiresat:
        example: otp expires in 2 minutes
        type: string
      otpsent:
        example: otp generated successfully
        type: string
    type: object
  models.BFFValidateUserOtpRequest:
    properties:
      otp:
        type: string
      username:
        example: Sakshi
        maxLength: 32
        minLength: 5
        type: string
    required:
    - otp
    - username
    type: object
  models.BFFValidateUserOtpResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  models.ErrorAPIResponse:
    properties:
      error:
        type: string
      errors:
        $ref: '#/definitions/models.ErrorMessage'
    type: object
  models.ErrorMessage:
    properties:
      errorMessage:
        type: string
      key:
        type: string
    type: object
info:
  contact: {}
  description: Omnenest backend for watchlist micro-service (Middleware layer).
  title: omnenest-backend
  version: "1.0"
paths:
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password and return message
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/models.BFFChangePasswordResponse'
        "400":
          description: Invalid Input Payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "401":
          description: Password mismatch with confirm password
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "404":
          description: Invalid Username
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - User
  /api/auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT tokens
      parameters:
      - description: Signin Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFSigninUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BFFSigninUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Sign in user
      tags:
      - User
  /api/auth/signup:
    post:
      consumes:
      - application/json
      description: Handles user registration by validating input and storing user
        details
      parameters:
      - description: User Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFCreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            type: string
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Create a new user
      tags:
      - User
  /api/auth/validate-otp:
    post:
      consumes:
      - application/json
      description: Validates user OTP and return clear success/ failure message
      parameters:
      - description: User OTP Validation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFValidateUserOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP validation successful
          schema:
            $ref: '#/definitions/models.BFFValidateUserOtpResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "401":
          description: 'Case A: Incorrect OTP / Case B: Expired OTP'
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Validates user OTP
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
    x-extension-openapi: '{"example": "value on a json format"}'
swagger: "2.0"
